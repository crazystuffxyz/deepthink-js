<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newtonian Gravity Sandbox</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;

            color: #eee;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #444;
            user-select: none;
            pointer-events: auto;
            backdrop-filter: blur(8px);

        .control-group {
            margin-bottom: 15px;

        label {
            display: block;

        }

        }

            background: #222;
        }

            font-family: 'Courier New', Courier, monospace;

            border-top: 1px solid #333;
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="control-group">
            <label for="g-slider">Gravitational Constant (G)</label>
            <input type="range" id="g-slider" min="0" max="5" step="0.1" value="1">
        </div>
        <div class="control-group">
            <button id="reset-btn">Reset Simulation</button>
        </div>
        <div id="stats">
            G: 1.0<br>
            Planets: 0
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const gSlider = document.getElementById('g-slider');
        const resetBtn = document.getElementById('reset-btn');
        const statsDiv = document.getElementById('stats');

        // Simulation State
        let G = 1.0;
        const EPSILON = 5; 
        const DT = 1 / 60;
        const SUBSTEPS = 4;
        const TRAIL_LENGTH = 200;
        const VELOCITY_SCALE = 0.2; 

        let planets = [];
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Interaction
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
            dragCurrent.x = e.clientX;
            dragCurrent.y = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                dragCurrent.x = e.clientX;
                dragCurrent.y = e.clientY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            // Velocity proportional to (currentCursor - clickStart)
            const vx = (e.clientX - dragStart.x) * VELOCITY_SCALE;
            const vy = (e.clientY - dragStart.y) * VELOCITY_SCALE;

            planets.push({
                x: dragStart.x,
                y: dragStart.y,
                vx: vx,
                vy: vy,
                mass: 1,
                trail: [],
                color: `hsl(${Math.random() * 360}, 70%, 60%)`
            });
        });

        resetBtn.addEventListener('click', () => {
            planets = [];
        });

        gSlider.addEventListener('input', (e) => {
            G = parseFloat(e.target.value);
        });

        function updatePhysics() {
            const subDt = DT / SUBSTEPS;

            for (let s = 0; s < SUBSTEPS; s++) {
                const accels = planets.map(() => ({ ax: 0, ay: 0 }));

                for (let i = 0; i < planets.length; i++) {
                    for (let j = i + 1; j < planets.length; j++) {
                        const p1 = planets[i];
                        const p2 = planets[j];

                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const distSq = dx * dx + dy * dy;
                        
                        // Softening parameter epsilon=5 to avoid singularities
                        // Force = G * m1 * m2 / (r^2 + eps^2)
                        // Accel = Force / mass
                        const softenedDist = Math.pow(distSq + EPSILON * EPSILON, 1.5);
                        const common = G / softenedDist;
                        
                        const ax = common * dx;
                        const ay = common * dy;

                        accels[i].ax += ax * p2.mass;
                        accels[i].ay += ay * p2.mass;
                        accels[j].ax -= ax * p1.mass;
                        accels[j].ay -= ay * p1.mass;
                    }
                }

                for (let i = 0; i < planets.length; i++) {
                    const p = planets[i];
                    const a = accels[i];

                    p.vx += a.ax * subDt;
                    p.vy += a.ay * subDt;
                    p.x += p.vx * subDt;
                    p.y += p.vy * subDt;
                }
            }

            for (let p of planets) {
                p.trail.push({ x: p.x, y: p.y });
                if (p.trail.length > TRAIL_LENGTH) {
                    p.trail.shift();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Trails
            ctx.lineWidth = 2;
            for (let p of planets) {
                if (p.trail.length < 2) continue;
                ctx.beginPath();
                ctx.strokeStyle = p.color;
                for (let i = 0; i < p.trail.length; i++) {
                    const pos = p.trail[i];
                    ctx.globalAlpha = (i / p.trail.length) * 0.5;
                    if (i === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1.0;

            // Draw Planets
            for (let p of planets) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.closePath();
            }

            // Draw Launch Vector
            if (isDragging) {
                ctx.beginPath();
                ctx.moveTo(dragStart.x, dragStart.y);
                ctx.lineTo(dragCurrent.x, dragCurrent.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.beginPath();
                ctx.arc(dragStart.x, dragStart.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            statsDiv.innerHTML = `G: ${G.toFixed(1)}<br>Planets: ${planets.length}`;
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
