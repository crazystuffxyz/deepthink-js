<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newtonian Gravity Sandbox</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            display: block;

            padding: 15px;
            border-radius: 8px;

            user-select: none;

            width: 150px;

            position: absolute;
            pointer-events: none;

</head>
<body>

    <div id="ui">
        <div class="control-group">
            <label for="gSlider">Gravitational Constant (G)</label>
            <input type="range" id="gSlider" min="0" max="5" step="0.1" value="1">
        </div>
        <button id="resetBtn">RESET SIMULATION</button>
    </div>

    <div id="stats">
        G: <span id="gVal">1.0</span><br>
        Planets: <span id="pCount">0</span>
    </div>

    <div id="vector-line"></div>
    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const gSlider = document.getElementById('gSlider');
        const gValDisp = document.getElementById('gVal');
        const pCountDisp = document.getElementById('pCount');
        const resetBtn = document.getElementById('resetBtn');
        const vectorLine = document.getElementById('vector-line');

        let width, height;
        let planets = [];
        let G = 1.0;
        const EPSILON = 5; // Softening parameter
        const DT = 1 / 60;
        const SUBSTEPS = 4;
        const MAX_TRAIL = 200;
        const VELOCITY_SCALE = 0.5; // Scale pixels to velocity units

        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };

        class Planet {
            constructor(x, y, vx, vy, mass = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.trail = [];
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
            }

            updatePosition() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > MAX_TRAIL) {
                    this.trail.shift();
                }
                this.x += this.vx * DT;
                this.y += this.vy * DT;
            }

            draw() {
                // Draw Trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    for (let i = 0; i < this.trail.length; i++) {
                        const p = this.trail[i];
                        const alpha = i / this.trail.length;
                        ctx.globalAlpha = alpha * 0.5;
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // Draw Planet
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function init() {
            window.addEventListener('resize', resize);
            resize();

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                dragCurrent = { x: e.clientX, y: e.clientY };
                
                vectorLine.style.display = 'block';
                vectorLine.style.left = dragStart.x + 'px';
                vectorLine.style.top = dragStart.y + 'px';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                dragCurrent = { x: e.clientX, y: e.clientY };
                
                const dx = dragCurrent.x - dragStart.x;
                const dy = dragCurrent.y - dragStart.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                
                vectorLine.style.width = dist + 'px';
                vectorLine.style.transform = `rotate(${angle}rad)`;
            });

            window.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                vectorLine.style.display = 'none';

                const vx = (dragStart.x - e.clientX) * VELOCITY_SCALE;
                const vy = (dragStart.y - e.clientY) * VELOCITY_SCALE;
                
                planets.push(new Planet(dragStart.x, dragStart.y, vx, vy));
            });

            gSlider.addEventListener('input', () => {
                G = parseFloat(gSlider.value);
                gValDisp.innerText = G.toFixed(1);
            });

            resetBtn.addEventListener('click', () => {
                planets = [];
            });

            requestAnimationFrame(loop);
        }

        function physicsStep() {
            // O(n^2) Gravity Calculation
            for (let i = 0; i < planets.length; i++) {
                let ax = 0;
                let ay = 0;
                const p1 = planets[i];

                for (let j = 0; j < planets.length; j++) {
                    if (i === j) continue;
                    const p2 = planets[j];
                    
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distSq = dx * dx + dy * dy + EPSILON;
                    const dist = Math.sqrt(distSq);
                    
                    // F = G * m1 * m2 / r^2
                    // a = F / m1 = G * m2 / r^2
                    const force = (G * p2.mass) / distSq;
                    
                    ax += force * (dx / dist);
                    ay += force * (dy / dist);
                }
                
                p1.vx += ax * DT;
                p1.vy += ay * DT;
            }

            // Update positions after all forces computed
            for (const p of planets) {
                p.updatePosition();
            }
        }

        function loop() {
            // Physics substeps
            for (let s = 0; s < SUBSTEPS; s++) {
                physicsStep();
            }

            // Rendering
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            for (const p of planets) {
                p.draw();
            }

            pCountDisp.innerText = planets.length;
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
