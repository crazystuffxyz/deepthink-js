<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Newtonian Gravity Sandbox</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
  }
  canvas {
    display: block; position: absolute; top: 0; left: 0;
    cursor: crosshair;
    touch-action: none;
  }
  .panel {
    position: fixed;
    background: rgba(15, 15, 22, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 14px;
    z-index: 10;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #controls { top: 12px; left: 12px; font-size: 13px; }
  #controls label { display: inline-block; margin-right: 10px; vertical-align: middle; }
  #controls input[type=range] { width: 160px; vertical-align: middle; cursor: pointer; accent-color: #42a5f5; }
  #controls button {
    background: linear-gradient(180deg, #3a3a46, #25252e);
    color: #fff; border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 14px; cursor: pointer; border-radius: 5px;
    margin-left: 10px; font-size: 12px; font-weight: 500;
    transition: background 0.15s, transform 0.05s;
  }
  #controls button:hover { background: linear-gradient(180deg, #4a4a56, #353542); }
  #controls button:active { transform: translateY(1px); }
  #gval { display: inline-block; min-width: 40px; font-family: ui-monospace, "SF Mono", Menlo, monospace; text-align: right; }

    font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.3px;
  }
  .hint {
    position: fixed; bottom: 12px; left: 12px;
    font-size: 11px; color: rgba(255,255,255,0.5);
    z-index: 10; pointer-events: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls" class="panel">
  <label>G: <span id="gval">1.00</span></label>
  <input type="range" id="gslider" min="0" max="5" step="0.01" value="1">
  <button id="reset">Reset</button>
</div>
<div id="info" class="panel">G = 1.00 &nbsp;|&nbsp; Planets: 0</div>
<div class="hint">click &amp; drag to launch a planet</div>
<script>
(function() {
  'use strict';

  // --- DOM ---
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const gSlider = document.getElementById('gslider');
  const gValText = document.getElementById('gval');
  const resetBtn = document.getElementById('reset');
  const infoPanel = document.getElementById('info');

  // --- Config ---
  let G = 1.0;
  const SOFTENING = 5.0;
  const SOFTENING_SQ = SOFTENING * SOFTENING;
  const FIXED_DT = 1 / 60;
  const MAX_SUBSTEPS = 4;
  const TRAIL_LENGTH = 200;
  const TRAIL_MAX = TRAIL_LENGTH * 2; // flat [x,y,x,y,...]
  const FADE_ALPHA = 0.05;
  const VELOCITY_SCALE = 1.0; // 1px drag = 1 unit/s
  const MIN_W = 600, MIN_H = 400;

  // --- Canvas resize ---
  function resize() {
    const w = Math.max(MIN_W, window.innerWidth);
    const h = Math.max(MIN_H, window.innerHeight);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Planets ---
  const planets = [];
  const COLORS = [
    '#ff5252', '#ff9800', '#ffeb3b', '#66bb6a', '#26c6da',
    '#42a5f5', '#ab47bc', '#ec407a', '#9ccc65', '#29b6f6',
    '#7e57c2', '#ff7043', '#5c6bc0', '#26a69a', '#d4e157'
  ];
  let colorIdx = 0;

  function makePlanet(x, y, vx, vy, mass) {
    return {
      x: x, y: y, vx: vx, vy: vy, mass: mass,
      fx: 0, fy: 0,
      color: COLORS[colorIdx % COLORS.length],
      trail: [] // flat [x0,y0,x1,y1,...]
    };
  }

  // --- Input state ---
  let mouseDown = false;
  let startX = 0, startY = 0;
  let curX = 0, curY = 0;
  let pending = null;

  function pointerXY(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function beginCreate(x, y) {
    startX = curX = x;
    startY = curY = y;
    mouseDown = true;
    pending = makePlanet(x, y, 0, 0, 1);
    colorIdx++;
  }

  function updateCreate(x, y) {
    curX = x; curY = y;
    if (mouseDown && pending) {
      pending.vx = (curX - startX) * VELOCITY_SCALE;
      pending.vy = (curY - startY) * VELOCITY_SCALE;
    }
  }

  function endCreate() {
    if (mouseDown && pending) {
      planets.push(pending);
      pending = null;
    }
    mouseDown = false;
  }

  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const p = pointerXY(e);
    beginCreate(p.x, p.y);
  });
  window.addEventListener('mousemove', (e) => {
    const p = pointerXY(e);
    updateCreate(p.x, p.y);
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button !== 0) return;
    endCreate();
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Touch
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const p = pointerXY(e);
    beginCreate(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const p = pointerXY(e);
    updateCreate(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    endCreate();
  }, { passive: false });
  canvas.addEventListener('touchcancel', (e) => {
    endCreate();
  });

  // --- UI ---
  gSlider.addEventListener('input', () => {
    G = parseFloat(gSlider.value);
    gValText.textContent = G.toFixed(2);
  });

  resetBtn.addEventListener('click', () => {
    planets.length = 0;
    pending = null;
    mouseDown = false;
    colorIdx = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  // --- Physics (fixed timestep, semi-implicit Euler) ---
  function physicsStep(dt) {
    const n = planets.length;
    // Reset accumulated forces
    for (let i = 0; i < n; i++) {
      planets[i].fx = 0;
      planets[i].fy = 0;
    }
    // Pairwise Newtonian gravity with softening
    for (let i = 0; i < n; i++) {
      const a = planets[i];
      for (let j = i + 1; j < n; j++) {
        const b = planets[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const r2 = dx * dx + dy * dy;
        const softR2 = r2 + SOFTENING_SQ;
        const invRSoft = 1 / Math.sqrt(softR2);
        const Fmag = G * a.mass * b.mass / softR2;
        const fx = Fmag * dx * invRSoft;
        const fy = Fmag * dy * invRSoft;
        a.fx += fx; a.fy += fy;
        b.fx -= fx; b.fy -= fy;
      }
    }
    // Integrate
    for (let i = 0; i < n; i++) {
      const p = planets[i];
      const ax = p.fx / p.mass;
      const ay = p.fy / p.mass;
      p.vx += ax * dt;
      p.vy += ay * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // Trail update
      p.trail.push(p.x, p.y);
      if (p.trail.length > TRAIL_MAX) {
        p.trail.splice(0, p.trail.length - TRAIL_MAX);
      }
    }
  }

  // --- Rendering ---
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function render() {
    // Alpha-blended fade overlay for motion-blur / trail decay
    ctx.fillStyle = 'rgba(0,0,0,' + FADE_ALPHA + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Fading trails (linear gradient: transparent at oldest -> opaque at newest)
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const t = p.trail;
      if (t.length < 4) continue;
      const fx = t[0], fy = t[1];
      const lx = t[t.length - 2], ly = t[t.length - 1];
      // Skip degenerate gradients
      if (fx === lx && fy === ly) {
        ctx.strokeStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(lx, ly);
        ctx.stroke();
        continue;
      }
      const grad = ctx.createLinearGradient(fx, fy, lx, ly);
      grad.addColorStop(0, hexToRgba(p.color, 0));
      grad.addColorStop(1, p.color);
      ctx.strokeStyle = grad;
      ctx.beginPath();
      ctx.moveTo(t[0], t[1]);
      for (let k = 2; k < t.length; k += 2) {
        ctx.lineTo(t[k], t[k + 1]);
      }
      ctx.stroke();
    }

    // Planets with soft glow
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const r = Math.max(3, Math.sqrt(p.mass) * 3.5);
      // Outer glow
      const gr = r * 2.8;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
      grad.addColorStop(0, p.color);
      grad.addColorStop(0.2, hexToRgba(p.color, 0.55));
      grad.addColorStop(0.6, hexToRgba(p.color, 0.12));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, gr, 0, Math.PI * 2);
      ctx.fill();
      // Core
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      // Bright center
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(p.x - r * 0.25, p.y - r * 0.25, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // Pending planet preview
    if (pending) {
      const dx = curX - startX;
      const dy = curY - startY;
      const dist2 = dx * dx + dy * dy;
      const r = Math.max(3, Math.sqrt(pending.mass) * 3.5);
      // Faint guide circle at launch point
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = pending.color;
      ctx.beginPath();
      ctx.arc(startX, startY, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      // Velocity arrow
      if (dist2 > 4) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.setLineDash([]);
        const ang = Math.atan2(dy, dx);
        const ah = 11;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(curX, curY);
        ctx.lineTo(curX - ah * Math.cos(ang - 0.4), curY - ah * Math.sin(ang - 0.4));
        ctx.lineTo(curX - ah * Math.cos(ang + 0.4), curY - ah * Math.sin(ang + 0.4));
        ctx.closePath();
        ctx.fill();
        // Speed label
        const speed = Math.sqrt(dist2) * VELOCITY_SCALE;
        ctx.font = '11px ui-monospace, Menlo, monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('v = ' + speed.toFixed(0), curX + 12, curY - 8);
      }
    }

    // Info overlay
    infoPanel.innerHTML = 'G = ' + G.toFixed(2) + ' &nbsp;|&nbsp; Planets: ' + planets.length;
  }

  // --- Main loop with fixed-timestep accumulator ---
  let lastTime = performance.now();
  let acc = 0;

  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.25) dt = 0.25; // clamp huge gaps (tab switch, etc.)
    acc += dt;
    let steps = 0;
    while (acc >= FIXED_DT && steps < MAX_SUBSTEPS) {
      physicsStep(FIXED_DT);
      acc -= FIXED_DT;
      steps++;
    }
    if (steps >= MAX_SUBSTEPS) acc = 0; // drop excess to prevent spiral of death
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
