<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newtonian Gravity Sandbox</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            user-select: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 10;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        input[type=range] {
            width: 150px;
            cursor: pointer;

        button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #666;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            text-align: right;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="control-group">
            <label for="g-slider">Gravitational Constant (G)</label>
            <input type="range" id="g-slider" min="0" max="5" step="0.1" value="1">
        </div>
        <button id="reset-btn">Reset Simulation</button>
    </div>

    <div id="stats">
        G: <span id="stat-g">1.0</span><br>
        Planets: <span id="stat-count">0</span>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const gSlider = document.getElementById('g-slider');
        const resetBtn = document.getElementById('reset-btn');
        const statG = document.getElementById('stat-g');
        const statCount = document.getElementById('stat-count');

        let planets = [];
        let G = 1.0;
        const EPSILON_SQ = 25; // softening epsilon = 5
        const DT = 1 / 60;
        const TRAIL_LENGTH = 200;
        const VELOCITY_SCALE = 1.0; // 1px drag = 1 unit/s velocity

        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let accumulator = 0;

        class Planet {
            constructor(x, y, vx, vy, mass = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.trail = [];
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
            }

            updatePosition() {
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > TRAIL_LENGTH) {
                    this.trail.shift();
                }
                this.x += this.vx * DT;
                this.y += this.vy * DT;
            }

            draw() {
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    for (let i = 0; i < this.trail.length; i++) {
                        const pos = this.trail[i];
                        ctx.globalAlpha = (i / this.trail.length) * 0.5;
                        if (i === 0) ctx.moveTo(pos.x, pos.y);
                        else ctx.lineTo(pos.x, pos.y);
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            currentX = e.clientX;
            currentY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                currentX = e.clientX;
                currentY = e.clientY;
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                const vx = (e.clientX - startX) * VELOCITY_SCALE;
                const vy = (e.clientY - startY) * VELOCITY_SCALE;
                planets.push(new Planet(startX, startY, vx, vy));
                isDragging = false;
            }
        });

        resetBtn.addEventListener('click', () => {
            planets = [];
        });

        gSlider.addEventListener('input', () => {
            G = parseFloat(gSlider.value);
        });

        function physicsStep() {
            const accels = planets.map(() => ({ax: 0, ay: 0}));

            for (let i = 0; i < planets.length; i++) {
                const p1 = planets[i];
                for (let j = i + 1; j < planets.length; j++) {
                    const p2 = planets[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq + EPSILON_SQ);
                    const force = (G * p1.mass * p2.mass) / (distSq + EPSILON_SQ);
                    
                    const fx = force * (dx / dist);
                    const fy = force * (dy / dist);

                    accels[i].ax += fx / p1.mass;
                    accels[i].ay += fy / p1.mass;
                    accels[j].ax -= fx / p2.mass;
                    accels[j].ay -= fy / p2.mass;
                }
            }

            for (let i = 0; i < planets.length; i++) {
                const p = planets[i];
                p.vx += accels[i].ax * DT;
                p.vy += accels[i].ay * DT;
                p.updatePosition();
            }
        }

        let lastTime = performance.now();
        function loop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            accumulator += deltaTime;
            let steps = 0;
            while (accumulator >= DT && steps < 4) {
                physicsStep();
                accumulator -= DT;
                steps++;
            }

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let p of planets) {
                p.draw();
            }

            if (isDragging) {
                ctx.beginPath();
                ctx.strokeStyle = 'white';
                ctx.setLineDash([5, 5]);
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.fillStyle = 'white';
                ctx.arc(startX, startY, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            statG.innerText = G.toFixed(1);
            statCount.innerText = planets.length;

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
